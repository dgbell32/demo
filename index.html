<!-- Fonts with system fallback for offline use -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" onerror="this.remove()">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#F0F4FF;color:#111827;height:100%;overflow:hidden;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
:root{
  --blue-950:#0F1E4A;--blue-900:#172554;--blue-800:#1E3A8A;
  --blue-700:#1D4ED8;--blue-600:#2563EB;--blue-500:#3B82F6;
  --blue-100:#DBEAFE;--blue-50:#EFF6FF;
  --orange-600:#EA580C;--orange-500:#F97316;--orange-100:#FFEDD5;--orange-50:#FFF7ED;
  --ink:#111827;--ink-soft:#374151;--ink-muted:#6B7280;--ink-faint:#9CA3AF;
  --surface:#F0F4FF;--surface-2:#E8EEFF;--white:#FFFFFF;
  --border:rgba(37,99,235,0.10);--border-2:rgba(37,99,235,0.18);
  --hot:#DC2626;--hot-bg:#FEF2F2;--warm:#D97706;--warm-bg:#FFFBEB;
  --cold:#2563EB;--cold-bg:#EFF6FF;--risk:#B91C1C;--risk-bg:#FEF2F2;
  --risk-border:rgba(185,28,28,0.2);
  --radius:14px;--radius-sm:10px;--radius-xs:7px;
  --sh:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(37,99,235,0.06);
  --nav-h:62px;--hdr-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)
}

/* ── SHELL ── */
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;position:relative;overflow:hidden}

/* ── TOP BAR ── */
.top-bar{
  background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-800) 100%);
  display:flex;align-items:center;padding:0 14px;height:var(--hdr-h);
  padding-top:var(--safe-t);flex-shrink:0;z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,0.2)
}
.tb-back{
  display:none;align-items:center;gap:4px;color:rgba(255,255,255,.7);
  font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;padding:6px 8px 6px 0;
  margin-right:2px;min-width:60px
}
.tb-back.visible{display:flex}
.tb-back:active{opacity:.7}
.wordmark{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.velu-logo{
  width:28px;height:28px;background:var(--blue-600);border-radius:7px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(37,99,235,0.4)
}
.vcheck{width:14px;height:14px;position:relative}
.vcheck::before{content:'✓';color:white;font-size:13px;font-weight:800;position:absolute;top:50%;left:50%;transform:translate(-50%,-52%)}
.odot{width:5px;height:5px;background:var(--orange-500);border-radius:50%;position:absolute;bottom:-1px;right:-1px;border:1.5px solid var(--blue-600)}
.wtext{font-size:19px;font-weight:800;color:white;letter-spacing:-.03em;white-space:nowrap}
.wtext em{font-style:normal;font-size:10px;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:.07em;text-transform:uppercase;margin-left:5px;vertical-align:middle}
.ptoggle{display:flex;background:rgba(255,255,255,.1);border-radius:22px;padding:3px;gap:2px;flex-shrink:0}
.ptbtn{padding:5px 13px;border-radius:18px;border:none;background:transparent;color:rgba(255,255,255,.45);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.ptbtn.on{background:var(--orange-500);color:white;box-shadow:0 2px 8px rgba(249,115,22,.4)}

/* ── SCREENS ── */
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h)+var(--safe-b)+12px);display:none}
.screen.on{display:block}
.screen::-webkit-scrollbar{display:none}

/* ── SLIDE PANELS (push from right) ── */
.panel{position:absolute;inset:0;background:var(--surface);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,0,.15,1);padding-bottom:32px;display:none}
.panel.open{transform:translateX(0);display:block}
.panel::-webkit-scrollbar{display:none}
.panel-hdr{background:linear-gradient(160deg,var(--blue-900) 0%,var(--blue-800) 100%);padding:14px 16px 20px;padding-top:calc(var(--safe-t)+8px)}
.panel-body{padding:14px}

/* ── BOTTOM NAV ── */
.bnav{background:white;border-top:1px solid var(--border-2);display:flex;height:var(--nav-h);padding-bottom:var(--safe-b);flex-shrink:0;z-index:50;box-shadow:0 -4px 20px rgba(37,99,235,0.07)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--ink-faint);transition:color .15s;padding:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;position:relative}
.ni.on{color:var(--blue-600)}
.ni-icon{font-size:19px;line-height:1}
.ni-lbl{font-size:10px;font-weight:600}
.nbadge{position:absolute;top:8px;right:calc(50% - 14px);background:var(--orange-500);color:white;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid white;padding:0 3px}
.ni-pip{width:4px;height:4px;border-radius:50%;background:var(--blue-600);margin-top:1px;opacity:0;transition:opacity .2s}
.ni.on .ni-pip{opacity:1}

/* ── SHARED TYPOGRAPHY ── */
.shdr{padding:20px 16px 12px}
.stitle{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.2}
.ssub{font-size:12px;color:var(--ink-muted);margin-top:3px;font-weight:500}
.slbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);padding:12px 16px 8px;display:flex;align-items:center;gap:6px}
.pill{background:var(--blue-100);border-radius:10px;padding:2px 7px;font-size:10px;color:var(--blue-700);font-weight:700}
.pill-o{background:var(--orange-100);color:var(--orange-600)}
.demo-note{display:flex;justify-content:center;padding:2px 0 10px}
.demo-note span{background:var(--blue-100);color:var(--blue-700);font-size:10px;padding:3px 10px;border-radius:10px;letter-spacing:.05em;font-weight:600}

/* ── CARDS ── */
.llist{padding:0 12px}
.lcard{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin-bottom:8px;cursor:pointer;transition:transform .12s;position:relative;overflow:hidden;box-shadow:var(--sh)}
.lcard:active{transform:scale(.983)}
.lcard-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.lcard-inner{padding-left:10px}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px}
.lname{font-weight:700;font-size:15px;letter-spacing:-.01em}
.lscore{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;flex-shrink:0;margin-left:8px}
.hs{background:var(--hot-bg);color:var(--hot)}
.ws{background:var(--warm-bg);color:var(--warm)}
.cs{background:var(--cold-bg);color:var(--cold)}
.lstage{font-size:12px;color:var(--ink-muted);margin-bottom:7px;font-weight:500}
.ltags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);font-weight:500}
.tag-r{background:var(--risk-bg);color:var(--risk);font-weight:600;border:1px solid var(--risk-border)}
.tag-b{background:var(--blue-50);color:var(--blue-700);font-weight:600}

.bcard{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:8px;cursor:pointer;transition:transform .12s;box-shadow:var(--sh)}
.bcard:active{transform:scale(.983)}
.bcard-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.bavatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0}
.binfo{flex:1}
.bname{font-weight:700;font-size:14px;letter-spacing:-.01em}
.bstage{font-size:11px;color:var(--ink-muted);font-weight:500}
.bscore{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;align-self:flex-start;flex-shrink:0}
.bintent{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:9px}
.baction{background:var(--blue-50);border-radius:var(--radius-sm);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border)}
.baction-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.baction-txt{font-size:12px;color:var(--blue-700);font-weight:500;line-height:1.5;font-style:italic}

/* broker stats */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.bstat{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--sh)}
.bstat-val{font-size:28px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.03em}
.bstat-lbl{font-size:11px;color:var(--ink-muted);margin-top:3px;font-weight:500}
.bstat-tr{font-size:11px;color:var(--blue-600);margin-top:3px;font-weight:600}
.bstat.risk .bstat-val{color:var(--risk)}
.bstat.risk .bstat-tr{color:var(--risk)}
.bstat.tap{cursor:pointer;transition:transform .12s,box-shadow .12s;user-select:none}
.bstat.tap:active{transform:scale(.96);box-shadow:none}
.bstat-tap-hint{font-size:9px;color:var(--blue-500);font-weight:700;margin-top:4px;letter-spacing:.03em}
.bstat.risk .bstat-tap-hint{color:var(--risk)}

/* ── QUADRANT DRILL-DOWN PANELS ── */
.qdrill-agent-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.qdrill-agent-row:last-child{border-bottom:none}
.qdrill-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:white;flex-shrink:0}
.qdrill-info{flex:1}
.qdrill-name{font-weight:700;font-size:13px}
.qdrill-sub{font-size:11px;color:var(--ink-muted);font-weight:500}
.qdrill-val{font-weight:800;font-size:15px;text-align:right}
.qdrill-sub2{font-size:10px;color:var(--ink-muted);text-align:right;font-weight:500}

.cinput:focus{border-color:var(--blue-500);background:white}
.cinput::placeholder{color:var(--ink-faint)}
.sbtn{width:40px;height:40px;border-radius:50%;background:var(--blue-600);border:none;color:white;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;box-shadow:0 3px 10px rgba(37,99,235,.35)}
.sbtn:active{transform:scale(.9);background:var(--blue-700)}
.sbtn:disabled{opacity:.35;box-shadow:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h)+var(--safe-b)+12px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--blue-900);color:white;font-size:13px;font-weight:600;padding:11px 20px;border-radius:22px;z-index:200;opacity:0;transition:all .25s;white-space:nowrap;box-shadow:0 8px 24px rgba(15,30,74,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.fu{animation:fu .28s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(min-width:600px){
  body{max-width:420px;margin:0 auto}
  #app{box-shadow:0 0 0 1px var(--border-2),0 24px 80px rgba(15,30,74,.15)}
}

/* ── LOGIN SCREEN ── */
#login-screen{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(160deg,var(--blue-900) 0%,var(--blue-800) 55%,#1a3fa8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px;padding-top:calc(var(--safe-t) + 40px);
  padding-bottom:calc(var(--safe-b) + 32px);
}
#login-screen.hidden{
  opacity:0;pointer-events:none;
  transition:opacity .4s ease
}
.login-logo{
  width:72px;height:72px;border-radius:20px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.35);margin-bottom:20px;
  flex-shrink:0
}
.login-logo img{width:72px;height:72px;display:block}
.login-brand{
  font-size:32px;font-weight:800;color:white;
  letter-spacing:-.04em;margin-bottom:4px
}
.login-tagline{
  font-size:13px;color:rgba(255,255,255,.45);
  font-weight:500;letter-spacing:.02em;margin-bottom:48px;
  font-style:italic
}
.login-form{width:100%;max-width:340px}
.login-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.45);
  margin-bottom:7px;display:block
}
.login-input{
  width:100%;background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:12px;padding:14px 16px;
  font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
  font-size:15px;color:white;outline:none;
  margin-bottom:14px;transition:border-color .2s,background .2s;
  -webkit-appearance:none
}
.login-input::placeholder{color:rgba(255,255,255,.25)}
.login-input:focus{
  border-color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.15)
}
.login-input.error{
  border-color:rgba(249,115,22,.8);
  animation:shake .35s ease
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.login-btn{
  width:100%;padding:15px;background:var(--orange-500);
  color:white;border:none;border-radius:12px;
  font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 20px rgba(249,115,22,.4);
  transition:transform .15s,background .15s;
  margin-top:4px;letter-spacing:.01em
}
.login-btn:active{transform:scale(.97);background:var(--orange-600)}
.login-error{
  font-size:12px;color:rgba(249,115,22,.9);font-weight:600;
  text-align:center;margin-top:12px;min-height:18px;
  transition:opacity .2s
}
.login-footer{
  position:absolute;bottom:calc(var(--safe-b) + 20px);
  font-size:11px;color:rgba(255,255,255,.2);font-weight:500;
  letter-spacing:.04em
}
.login-divider{
  display:flex;align-items:center;gap:12px;margin-bottom:24px
}
.login-divider-line{flex:1;height:1px;background:rgba(255,255,255,.1)}
.login-divider-text{font-size:11px;color:rgba(255,255,255,.25);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
